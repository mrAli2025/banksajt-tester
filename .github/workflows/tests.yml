name: Tester

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passing-level:
    name: Godkänt nivå
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: Bank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kontrollera projektstruktur
        shell: bash
        run: |
          test -f frontend/package.json || {
            echo "::error::frontend/package.json saknas. Skapa Next.js-projektet i mappen frontend."
            exit 1
          }
          test -f frontend/package-lock.json || {
            echo "::error::frontend/package-lock.json saknas. Projektet ska använda npm."
            exit 1
          }
          test -f backend/package.json || {
            echo "::error::backend/package.json saknas. Skapa Express-projektet i mappen backend."
            exit 1
          }
          test -f backend/package-lock.json || {
            echo "::error::backend/package-lock.json saknas. Projektet ska använda npm."
            exit 1
          }

      - name: Installera frontend
        run: npm ci --prefix frontend

      - name: Installera backend
        run: npm ci --prefix backend

      - name: Installera tester
        run: npm ci --prefix tests

      - name: Installera Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Skapa tabeller i databasen
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot Bank -e "
          CREATE TABLE users (
              id INT AUTO_INCREMENT PRIMARY KEY,
              username VARCHAR(256) NOT NULL,
              password VARCHAR(256) NOT NULL,
              created DATETIME DEFAULT CURRENT_TIMESTAMP,
              modified DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          );
          CREATE TABLE accounts (
              id INT AUTO_INCREMENT PRIMARY KEY,
              userId INT NOT NULL,
              amount INT DEFAULT 0
          );
          CREATE TABLE sessions (
              id INT AUTO_INCREMENT PRIMARY KEY,
              userId INT NOT NULL,
              token VARCHAR(256) NOT NULL
          );
          CREATE TABLE transactions (
              id INT AUTO_INCREMENT PRIMARY KEY,
              accountId INT NOT NULL,
              type ENUM('deposit', 'withdrawal') NOT NULL DEFAULT 'deposit',
              amount INT NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          "

      - name: Bygg frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: npm run build --prefix frontend

      - name: Kör tester
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: Bank
        run: npm test --prefix tests